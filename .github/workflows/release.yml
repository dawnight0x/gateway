name: Release

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  metadata:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      windows_major: ${{ steps.release.outputs.windows_major }}
      windows_minor: ${{ steps.release.outputs.windows_minor }}
      windows_patch: ${{ steps.release.outputs.windows_patch }}
      package_name: ${{ steps.release.outputs.package_name }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Validate release metadata
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw release.json | ConvertFrom-Json
          $pattern = '^v?(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)(?<prerelease>-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$'
          $versionMatch = [regex]::Match([string]$metadata.version, $pattern)
          $tagMatch = [regex]::Match("${{ github.ref_name }}", $pattern)
          if (-not $versionMatch.Success -or -not $tagMatch.Success) {
            throw "release metadata and tag must use major.minor.patch format"
          }
          $version = "$($versionMatch.Groups['major'].Value).$($versionMatch.Groups['minor'].Value).$($versionMatch.Groups['patch'].Value)$($versionMatch.Groups['prerelease'].Value)"
          $tagVersion = "$($tagMatch.Groups['major'].Value).$($tagMatch.Groups['minor'].Value).$($tagMatch.Groups['patch'].Value)$($tagMatch.Groups['prerelease'].Value)"
          if ($version -ne $tagVersion) {
            throw "release tag $tagVersion does not match release metadata version $version"
          }
          $packageName = [string]$metadata.packageName
          if ($packageName -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw "release package name contains unsupported characters"
          }
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "windows_major=$($versionMatch.Groups['major'].Value)" >> $env:GITHUB_OUTPUT
          "windows_minor=$($versionMatch.Groups['minor'].Value)" >> $env:GITHUB_OUTPUT
          "windows_patch=$($versionMatch.Groups['patch'].Value)" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($versionMatch.Groups['prerelease'].Success.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build:
    needs: metadata
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      WINDOWS_MAJOR: ${{ needs.metadata.outputs.windows_major }}
      WINDOWS_MINOR: ${{ needs.metadata.outputs.windows_minor }}
      WINDOWS_PATCH: ${{ needs.metadata.outputs.windows_patch }}
      PACKAGE_NAME: ${{ needs.metadata.outputs.package_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
            package_platform: win-x64
          - goos: linux
            goarch: amd64
            suffix: ""
            package_platform: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: ""
            package_platform: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run test:admin && npm run build:admin
      - run: git diff --exit-code -- web/admin/index.html web/admin/assets/render.js web/admin/assets/vendor/vue.runtime.global.prod.js
      - name: Stamp Windows version resource
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          ./scripts/generate-windows-resources.ps1 `
            -Major ([int]$env:WINDOWS_MAJOR) `
            -Minor ([int]$env:WINDOWS_MINOR) `
            -Patch ([int]$env:WINDOWS_PATCH) `
            -Build 0 `
            -ProductVersion $env:RELEASE_VERSION
      - name: Build binaries
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          $name = "$env:PACKAGE_NAME-$env:RELEASE_VERSION-${{ matrix.package_platform }}"
          New-Item -ItemType Directory -Force "stage/$name" | Out-Null
          $builtAt = [DateTime]::UtcNow.ToString("o")
          $ld = "-s -w " +
            "-X local-ai-gateway/internal/buildinfo.Version=$env:RELEASE_VERSION " +
            "-X local-ai-gateway/internal/buildinfo.Commit=${{ github.sha }} " +
            "-X local-ai-gateway/internal/buildinfo.BuiltAt=$builtAt"
          # gateway is the tray app: -H=windowsgui suppresses the console window
          # on Windows. gateway-backup stays a console tool on every platform.
          $gatewayLd = $ld
          if ("${{ matrix.goos }}" -eq "windows") {
            $gatewayLd = "$ld -H=windowsgui"
          }
          go build -trimpath -buildvcs=false -ldflags $gatewayLd -o "stage/$name/gateway${{ matrix.suffix }}" ./cmd/gateway
          go build -trimpath -buildvcs=false -ldflags $ld -o "stage/$name/gateway-backup${{ matrix.suffix }}" ./cmd/gateway-backup
          ./scripts/stage-release-package.ps1 `
            -Destination "stage/$name" `
            -Version $env:RELEASE_VERSION `
            -Commit "${{ github.sha }}" `
            -BuiltAt $builtAt `
            -Platform "${{ matrix.goos }}/${{ matrix.goarch }}" `
            -PackageName $env:PACKAGE_NAME
          if ("${{ matrix.goos }}" -eq "windows") {
            Compress-Archive -LiteralPath "stage/$name" -DestinationPath "stage/$name.zip" -CompressionLevel Optimal
          } else {
            tar -czf "stage/$name.tar.gz" -C stage $name
            if ($LASTEXITCODE -ne 0) {
              throw "tar archive creation failed with exit code $LASTEXITCODE"
            }
          }
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            stage/*.zip
            stage/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ env.RELEASE_VERSION }}-${{ matrix.package_platform }}
          path: |
            stage/*.zip
            stage/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: ${{ needs.metadata.outputs.package_name }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.PACKAGE_NAME }}-${{ env.RELEASE_VERSION }}-*
          path: release
          merge-multiple: true
      - name: Create checksums
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' } | Sort-Object Name)
          if ($archives.Count -lt 3) {
            throw "expected at least three platform archives, found $($archives.Count)"
          }
          $archives | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release/SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/SHA256SUMS
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | Sort-Object Name | ForEach-Object FullName)
          $arguments = @('release', 'create', '${{ github.ref_name }}') + $assets + @('--generate-notes', '--verify-tag')
          if ($env:IS_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE"
          }
