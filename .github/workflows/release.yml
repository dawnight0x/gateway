name: Release

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]

env:
  PACKAGE_NAME: gateway-beta6

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
            package_platform: win-x64
          - goos: linux
            goarch: amd64
            suffix: ""
            package_platform: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: ""
            package_platform: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize release version
        shell: pwsh
        run: |
          $match = [regex]::Match("${{ github.ref_name }}", '^v?(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)$')
          if (-not $match.Success) {
            throw "release tag must use major.minor.patch format"
          }
          "RELEASE_VERSION=$($match.Groups['major'].Value).$($match.Groups['minor'].Value).$($match.Groups['patch'].Value)" >> $env:GITHUB_ENV
          "WINDOWS_MAJOR=$($match.Groups['major'].Value)" >> $env:GITHUB_ENV
          "WINDOWS_MINOR=$($match.Groups['minor'].Value)" >> $env:GITHUB_ENV
          "WINDOWS_PATCH=$($match.Groups['patch'].Value)" >> $env:GITHUB_ENV
      - run: npm ci && npm run build:admin
      - run: git diff --exit-code -- web/admin/index.html web/admin/assets/render.js web/admin/assets/vendor/vue.runtime.global.prod.js
      - name: Stamp Windows version resource
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          ./scripts/generate-windows-resources.ps1 `
            -Major ([int]$env:WINDOWS_MAJOR) `
            -Minor ([int]$env:WINDOWS_MINOR) `
            -Patch ([int]$env:WINDOWS_PATCH) `
            -Build 0 `
            -ProductVersion $env:RELEASE_VERSION
      - name: Build binaries
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          $name = "$env:PACKAGE_NAME-${{ matrix.package_platform }}"
          New-Item -ItemType Directory -Force "stage/$name" | Out-Null
          $builtAt = [DateTime]::UtcNow.ToString("o")
          $ld = "-s -w " +
            "-X local-ai-gateway/internal/buildinfo.Version=$env:RELEASE_VERSION " +
            "-X local-ai-gateway/internal/buildinfo.Commit=${{ github.sha }} " +
            "-X local-ai-gateway/internal/buildinfo.BuiltAt=$builtAt"
          # gateway is the tray app: -H=windowsgui suppresses the console window
          # on Windows. gateway-backup stays a console tool on every platform.
          $gatewayLd = $ld
          if ("${{ matrix.goos }}" -eq "windows") {
            $gatewayLd = "$ld -H=windowsgui"
          }
          go build -trimpath -buildvcs=false -ldflags $gatewayLd -o "stage/$name/gateway${{ matrix.suffix }}" ./cmd/gateway
          go build -trimpath -buildvcs=false -ldflags $ld -o "stage/$name/gateway-backup${{ matrix.suffix }}" ./cmd/gateway-backup
          ./scripts/stage-release-package.ps1 `
            -Destination "stage/$name" `
            -Version $env:RELEASE_VERSION `
            -Commit "${{ github.sha }}" `
            -BuiltAt $builtAt `
            -Platform "${{ matrix.goos }}/${{ matrix.goarch }}" `
            -PackageName $env:PACKAGE_NAME
          if ("${{ matrix.goos }}" -eq "windows") {
            Compress-Archive -LiteralPath "stage/$name" -DestinationPath "stage/$name.zip" -CompressionLevel Optimal
          } else {
            tar -czf "stage/$name.tar.gz" -C stage $name
            if ($LASTEXITCODE -ne 0) {
              throw "tar archive creation failed with exit code $LASTEXITCODE"
            }
          }
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            stage/*.zip
            stage/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ matrix.package_platform }}
          path: |
            stage/*.zip
            stage/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.PACKAGE_NAME }}-*
          path: release
          merge-multiple: true
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release/SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --generate-notes --verify-tag
