version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      vue-runtime:
        patterns:
          - "vue"
          - "@vue/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
